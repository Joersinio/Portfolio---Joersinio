        <p>Vous avez un projet un tête? Créeons le ensemble !</p>  
        

        <div class="contact-contenu">

            <form id="formulaire-contact">

                <label for="nom">Nom</label>

                <input
                    type="text"
                    id="nom"
                    name="nom"
                    placeholder="Votre nom"
                    required
                >


                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Votre email"
                    required
                >


                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Votre message"
                    required
                ></textarea>


                <button type="submit">
                    Envoyer
                </button>

            </form>
