<!DOCTYPE html>
<html lang="fr">
<head>

    <div id="head"></div>
    <script src="../js/head.js"></script>

    <title>Me contacter</title>
</head>

<body class="contact">
      <header>

    <div id="menu"></div>
    <script src="../js/menu.js"></script>


      </header>
    <main>

        <div class="page7">
        <div id="profil"></div>

    <script src="../js/profil.js"></script>

        <section id="contact">

        <h1>LET'S TALK<span>.</span> <i data-lucide="mail"></i>
        </h1>

        <p>Vous avez un projet un tête? Créeons le ensemble !</p>  
        

        <div class="contact-contenu">

<form
    id="formulaire-contact"
    action="https://formsubmit.co/jjya13@gmail.com"
    method="POST"
>
    <label for="nom">Nom</label>

    <input
        type="text"
        id="nom"
        name="nom"
        placeholder="Votre nom"
        required
    >

    <label for="email">Email</label>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Votre email"
        required
    >

    <label for="message">Message</label>

    <textarea
        id="message"
        name="message"
        rows="6"
        placeholder="Votre message"
        required
    ></textarea>

    <input
        type="hidden"
        name="_subject"
        value="Nouveau message depuis mon portfolio"
    >

    <button type="submit">
        Envoyer
    </button>
</form>



</section>
</div>
    </main>

     <footer
    
     id="footer"></footer>
    <script src="../js/footer.js"></script>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
