<!DOCTYPE html>
<html lang="fr">
<head>

    <div id="head"></div>
    <script src="../js/head.js"></script>

    <title>Me contacter</title>
</head>

<body class="contact">
      <header>

    <div id="menu"></div>
    <script src="../js/menu.js"></script>


      </header>
    <main>

        <div class="page7">
        <div id="profil"></div>

    <script src="../js/profil.js"></script>

        <section id="contact">

        <h1>LET'S TALK <i data-lucide="mail"></i>
        </h1>

        <p>Vous avez un projet un tête? Créeons le ensemble !</p>  
        

        <div class="contact-contenu">

            <form id="formulaire-contact">

                <label for="nom">Nom</label>

                <input
                    type="text"
                    id="nom"
                    name="nom"
                    placeholder="Votre nom"
                    required
                >


                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Votre email"
                    required
                >


                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Votre message"
                    required
                ></textarea>


                <button type="submit">
                    Envoyer
                </button>

            </form>


</section>
</div>
    </main>

     <footer>

        <p>
            © 2026 Joersinio Silva
        </p>
     </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
